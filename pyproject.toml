[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avis"
version = "0.1.0"
description = "Refactored version of avis-main: text processing, TF-IDF, clustering, and experiments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "scikit-learn>=1.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
avis = ["data/*.txt"]
